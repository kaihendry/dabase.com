{{ $posts := where site.RegularPages "Section" "blog" }}
{{ with $posts.Related . | first 3 }}
<aside aria-labelledby="related-posts" data-pagefind-ignore>
  <h2 id="related-posts">Related posts</h2>
  <ul>
  {{ range . }}
    <li><a href="{{ .RelPermalink }}">{{ .LinkTitle | default (replace .File.BaseFileName "_" " " | title) }}</a></li>
  {{ end }}
  </ul>
</aside>
{{ end }}
