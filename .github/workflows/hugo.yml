name: Deploy Hugo site to S3/Cloudfront

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::407461997746:role/github-actions-Role-56IHHM969DKJ
          aws-region: ap-southeast-1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install search indexer
        run: npm ci

      - name: Build Hugo site and search index
        run: npm run build

      - name: Install media validation tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Validate before publishing
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/validate_podcast.py --deep

      - name: Sync to S3
        run: |
          # --size-only ignores mtime, which Hugo makes useless: it rebuilds
          # every file each run, so a plain sync re-uploads the whole 178MB site.
          # XML must be refreshed even when a correction has the same byte
          # length; otherwise size-only silently leaves listeners on stale RSS.
          aws s3 sync public/ s3://dabase.com --size-only --exclude "*.xml" --exclude "pagefind/*"
          aws s3 sync public/ s3://dabase.com --exclude "*" --include "*.xml" --content-type application/xml --cache-control "public, max-age=300"
          # Search metadata can change without changing length. Sync the complete
          # bundle normally and remove obsolete chunks only within this prefix.
          aws s3 sync public/pagefind/ s3://dabase.com/pagefind/ --delete --cache-control "public, max-age=300"

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id E6OVXGA61L6G6 --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id E6OVXGA61L6G6 --id "$INVALIDATION_ID"

      - name: Verify deployed RSS feeds
        run: >-
          python3 scripts/validate_podcast.py --skip-media
          --reference-dir public
          --feed https://dabase.com/podcast/index.xml
          --site-feed https://dabase.com/index.xml
