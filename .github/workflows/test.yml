name: Test podcast sync

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"

      - name: Install media validation tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Test the podcast validator
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install search indexer
        run: npm ci

      - name: Build Hugo site and search index
        run: npm run build

      - name: Validate RSS and playable media
        if: github.event_name != 'schedule'
        run: python3 scripts/validate_podcast.py --deep

      - name: Check deployed feeds on the daily run
        if: github.event_name == 'schedule'
        run: >-
          python3 scripts/validate_podcast.py --deep
          --feed https://dabase.com/podcast/index.xml
          --site-feed https://dabase.com/index.xml
